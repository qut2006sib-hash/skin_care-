name: Verify application
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skin_care_test
          POSTGRES_USER: skin_care_user
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skin_care_user -d skin_care_test"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: skin_care_test
      POSTGRES_USER: skin_care_user
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      RUN_RECOVERY_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r backend/requirements.txt
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python -m pytest -q -W ignore::DeprecationWarning
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: python -u tests/run_browser_checks.py
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/local_setup.sh
      - run: docker compose exec -T backend python manage.py import_pharmacy_catalog
      - name: Verify proxied health and catalog
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://localhost:3000/api/v1/health/',timeout=4) as r:
                      assert json.load(r)['status']=='ok'
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(1)
          with urllib.request.urlopen('http://localhost:3000/api/v1/catalog/products/') as r:
              data=json.load(r)
          assert len(data['products'])==18 and data['demo_mode'] is False
          variants=[v for p in data['products'] for v in p['variants']]
          assert all(v['price_syp'] is None and not v['orderable'] and v['available_quantity']==0 for v in variants)
          assert all(v['reference_price']['currency']=='USD' for v in variants)
          PY
      - run: docker compose restart backend worker
      - name: Verify restart retained catalog and disabled zones
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://localhost:3000/api/v1/catalog/products/',timeout=4) as r:
                      assert len(json.load(r)['products'])==18
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(1)
          with urllib.request.urlopen('http://localhost:3000/api/v1/delivery-zones/') as r:
              assert json.load(r)==[]
          PY
      - if: failure()
        run: docker compose logs --tail=150
      - if: always()
        run: docker compose down
