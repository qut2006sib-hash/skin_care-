name: Verify application
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skin_care_test
          POSTGRES_USER: skin_care_user
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skin_care_user -d skin_care_test"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: skin_care_test
      POSTGRES_USER: skin_care_user
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      RUN_RECOVERY_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r backend/requirements.txt
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python -m pytest -q -W ignore::DeprecationWarning
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
